[newrelic]
# --------------------------------------------------------------------------
# La license key y el app name se inyectan como variables de entorno:
#   NEW_RELIC_LICENSE_KEY  (desde SSM via ECS secrets)
#   NEW_RELIC_APP_NAME     (desde ECS environment)
# Las variables de entorno tienen precedencia sobre los valores del ini,
# por lo que no se definen aquí para evitar problemas de interpolación.
# --------------------------------------------------------------------------

# Activar/desactivar el agente sin cambiar código.
monitor_mode = true

# Nivel de log del agente (critical, error, warning, info, debug, verbosedebug).
log_level = info

# Ruta del log del agente. En contenedores se recomienda stdout.
log_file = stdout

# ------------------------------------------------------------------
# Apdex T (segundos) — umbral para clasificar transacciones como:
#   Satisfied  : tiempo ≤ apdex_t
#   Tolerating : tiempo > apdex_t y ≤ 4 * apdex_t
#   Frustrated : tiempo > 4 * apdex_t
# Un valor de 0.5 significa: ≤500ms satisfecho, ≤2s tolerable, >2s frustrado.
# ------------------------------------------------------------------
apdex_t = 0.5

# Instrumentación automática de Flask y SQLAlchemy está activa por defecto.

[newrelic:development]
monitor_mode = false

[newrelic:test]
monitor_mode = false
